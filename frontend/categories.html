<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories — CrowdFund</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="projects.css">
    <style>
        .categories-grid-full {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .category-card-large {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            color: #1a1a1a;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .category-card-large:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            border-color: #ff6b6b;
        }
        .category-card-large h3 {
            margin: 0;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container navbar">
            <a href="index.html" class="brand">
                <span class="brand-mark">CF</span>
                <span class="brand-name">CrowdFund</span>
            </a>
            <nav class="main-nav">
                <a href="projects.html">Explore</a>
                <a href="categories.html">Categories</a>
            </nav>
            <div class="nav-actions" id="nav-actions"></div>
        </div>
    </header>

    <main class="page-main">
        <div class="container">
            <div class="page-header">
                <div>
                    <h1>Categories</h1>
                    <p>Discover projects by exploring our diverse categories.</p>
                </div>
            </div>

            <div id="categories-loading" class="loading-state">
                Loading categories...
            </div>
            
            <div id="categories-empty" class="empty-state" hidden>
                <h3>No categories found</h3>
            </div>

            <div id="categories-grid" class="categories-grid-full" hidden></div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-brand">
                <a href="index.html" class="brand">
                    <span class="brand-mark">CF</span>
                    <span class="brand-name">CrowdFund</span>
                </a>
                <p>Community-powered funding for meaningful ideas.</p>
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
    <script src="categories.js"></script>
</body>
</html>
