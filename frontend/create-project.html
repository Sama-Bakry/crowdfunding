<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Start a Project — CrowdFund</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="projects.css">
</head>

<body>

    <header class="site-header">
        <div class="container navbar">

            <a href="index.html" class="brand">
                <span class="brand-mark">CF</span>
                <span class="brand-name">CrowdFund</span>
            </a>

            <nav class="main-nav">
                <a href="projects.html">Explore</a>
                
            </nav>

            <div class="nav-actions" id="nav-actions"></div>

        </div>
    </header>


    <main class="page-main">
        <div class="container">

            <div class="page-header">
                <div>
                    <h1>Start a project</h1>
                    <p>Tell people what you're building and why it matters.</p>
                </div>
            </div>


            <div id="create-alert" class="form-alert" hidden></div>


            <section class="form-card" id="details-card">

                <div class="form-section-title">Project details</div>
                <div class="form-section-subtitle">
                    All fields except tags are required.
                </div>

                <form id="create-project-form" novalidate>

                    <div class="form-group">
                        <label for="title">Project title</label>
                        <input type="text" id="title" name="title" placeholder="A short, clear title" required>
                        <small class="field-error" id="title-error"></small>
                    </div>

                    <div class="form-group">
                        <label for="details">Project details</label>
                        <textarea id="details" name="details" placeholder="Describe your project, its goals, and how the funds will be used." required></textarea>
                        <small class="field-error" id="details-error"></small>
                    </div>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" name="category" required>
                                <option value="">Select a category</option>
                            </select>
                            <small class="field-error" id="category-error"></small>
                        </div>

                        <div class="form-group">
                            <label for="target_amount">Target amount (EGP)</label>
                            <input type="number" id="target_amount" name="target_amount" min="1" step="0.01" placeholder="250000" required>
                            <small class="field-error" id="target_amount-error"></small>
                        </div>

                    </div>

                    <div class="form-group">
                        <label for="tags">
                            Tags
                            <span class="optional-label">Optional</span>
                        </label>
                        <input type="text" id="tags" name="tags" placeholder="solar, farming, community">
                        <small class="form-hint">Separate tags with commas.</small>
                        <small class="field-error" id="tags-error"></small>
                    </div>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="start_date">Campaign start date</label>
                            <input type="date" id="start_date" name="start_date" required>
                            <small class="field-error" id="start_date-error"></small>
                        </div>

                        <div class="form-group">
                            <label for="end_date">Campaign end date</label>
                            <input type="date" id="end_date" name="end_date" required>
                            <small class="field-error" id="end_date-error"></small>
                        </div>

                    </div>
                    <div class="form-group project-image-upload-group">

    <label for="image-input">
        Project images
        <span class="optional-label">Optional</span>
    </label>

    <div class="image-upload-grid" id="image-upload-grid">

        <label class="image-upload-add">
            <span class="image-upload-plus">+</span>
            <span>Add image</span>

            <input
                type="file"
                id="image-input"
                accept="image/*"
                multiple
                hidden
            >
        </label>

    </div>

    <small class="form-hint">
        Add one or more images to showcase your project.
    </small>

    <small
        class="field-error"
        id="images-error"
    ></small>

</div>

                    <button type="submit" id="create-button" class="button button-coral button-full">
                        <span id="create-button-text">Create project</span>
                    </button>

                </form>

            </section>


            

        </div>
    </main>


    <script src="app.js"></script>
    <script src="projects-common.js"></script>
    <script src="create-project.js"></script>

</body>
</html>
